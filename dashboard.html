<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — SmartPark 360</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var s = JSON.parse(localStorage.getItem("sp_settings") || "{}"); document.documentElement.setAttribute("data-theme", s.theme || "light"); } catch (e) {}
  </script>
</head>
<body data-page="dashboard">

  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo"><img src="assets/logo.svg" alt="SmartPark 360"><div class="loader-ring"></div></div>
      <div class="loader-bar"><span></span></div>
      <p class="loader-text">Loading SmartPark 360…</p>
    </div>
  </div>

  <div id="navbar"></div>

  <main id="page" class="page-wrap">
    <div class="container">

      <!-- Page head -->
      <header class="page-head d-flex flex-wrap align-items-end justify-content-between gap-3" data-aos="fade-up">
        <div>
          <div class="hello" id="helloLine">Good day!</div>
          <h1 class="page-title" id="welcomeTitle">Find your parking spot</h1>
        </div>
        <span class="live-badge"><span class="live-dot"></span>Live · updates every 5s</span>
      </header>

      <!-- Search + filters -->
      <section class="search-card" data-aos="fade-up" data-aos-delay="60">
        <div class="search-row">
          <div class="search-input-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by parking name, area or city…" autocomplete="off">
            <div class="suggest-box" id="suggestBox"></div>
          </div>
          <button class="btn btn-soft btn-lg" id="locateBtn" title="Use my location"><i class="fa-solid fa-location-crosshairs me-2"></i>My location</button>
        </div>
        <div class="filter-row">
          <button class="chip" id="chipAvailable"><i class="fa-solid fa-circle-check"></i>Available now</button>
          <button class="chip" id="chipOpen"><i class="fa-solid fa-clock"></i>Open now</button>
          <button class="chip">
            <i class="fa-solid fa-indian-rupee-sign"></i>
            <select id="priceFilter" aria-label="Max price">
              <option value="0">Any price</option>
              <option value="25">≤ ₹25</option>
              <option value="30">≤ ₹30</option>
              <option value="40">≤ ₹40</option>
              <option value="50">≤ ₹50</option>
            </select>
          </button>
          <button class="chip">
            <i class="fa-solid fa-arrow-down-wide-short"></i>
            <select id="sortFilter" aria-label="Sort by">
              <option value="distance">Distance (nearest)</option>
              <option value="rating">Rating (highest)</option>
              <option value="price-asc">Price (low → high)</option>
              <option value="price-desc">Price (high → low)</option>
              <option value="name">Name (A → Z)</option>
            </select>
          </button>
          <span class="filter-count" id="filterCount"></span>
        </div>
      </section>

      <!-- Mini stats -->
      <div class="row g-3 mb-4" data-aos="fade-up" data-aos-delay="100">
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon" style="background:var(--accent-soft);color:var(--accent-deep)"><i class="fa-solid fa-location-dot"></i></div>
            <div class="kpi-num" id="statNearby">—</div>
            <div class="kpi-label">Zones near you</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon" style="background:rgba(47,163,107,.12);color:var(--green)"><i class="fa-solid fa-square-parking"></i></div>
            <div class="kpi-num" id="statAvailable">—</div>
            <div class="kpi-label">Free bays citywide</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon" style="background:rgba(47,111,237,.12);color:var(--blue)"><i class="fa-solid fa-indian-rupee-sign"></i></div>
            <div class="kpi-num" id="statAvgPrice">—</div>
            <div class="kpi-label">Average hourly rate</div>
          </div>
        </div>
      </div>

      <!-- Parking cards -->
      <div class="parking-grid" id="parkingGrid"></div>
      <div class="empty-state d-none" id="emptyState">
        <div class="ei"><i class="fa-solid fa-square-parking"></i></div>
        <h5>No parking zones match your filters</h5>
        <p class="mb-0">Try clearing the search or loosening a filter.</p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/utils.js"></script>
  <script src="data/parking-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
