<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Parking Map — SmartPark 360</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var s = JSON.parse(localStorage.getItem("sp_settings") || "{}"); document.documentElement.setAttribute("data-theme", s.theme || "light"); } catch (e) {}
  </script>
</head>
<body data-page="map">

  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo"><img src="assets/logo.svg" alt="SmartPark 360"><div class="loader-ring"></div></div>
      <div class="loader-bar"><span></span></div>
      <p class="loader-text">Loading SmartPark 360…</p>
    </div>
  </div>

  <div id="navbar"></div>

  <main id="page" class="page-wrap" style="padding-top:var(--nav-h)">
    <div class="map-shell">
      <!-- Sidebar -->
      <aside class="map-side">
        <div class="map-side-head">
          <div>
            <h5><i class="fa-solid fa-square-parking me-2 text-accent"></i>Smart Zones</h5>
            <small class="text-muted-sp" id="mapZoneCount">— zones online</small>
          </div>
          <span class="live-badge"><span class="live-dot"></span>Live</span>
        </div>
        <div id="lotList"></div>
      </aside>

      <!-- Map -->
      <div class="map-main">
        <div id="map"></div>
        <button class="map-locate" id="locateBtn" title="Find my location"><i class="fa-solid fa-location-crosshairs"></i></button>
        <div class="map-legend">
          <span><span class="legend-dot" style="background:var(--green);border-radius:50%"></span>Has free bays</span>
          <span><span class="legend-dot" style="background:var(--red);border-radius:50%"></span>Full</span>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/utils.js"></script>
  <script src="data/parking-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
