<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings — SmartPark 360</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var s = JSON.parse(localStorage.getItem("sp_settings") || "{}"); document.documentElement.setAttribute("data-theme", s.theme || "light"); } catch (e) {}
  </script>
</head>
<body data-page="my-bookings">

  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo"><img src="assets/logo.svg" alt="SmartPark 360"><div class="loader-ring"></div></div>
      <div class="loader-bar"><span></span></div>
      <p class="loader-text">Loading SmartPark 360…</p>
    </div>
  </div>

  <div id="navbar"></div>

  <main id="page" class="page-wrap">
    <div class="container">

      <header class="page-head d-flex flex-wrap align-items-end justify-content-between gap-3" data-aos="fade-up">
        <div>
          <div class="hello">Everything in one place</div>
          <h1 class="page-title">My Bookings</h1>
        </div>
        <span class="live-badge"><span class="live-dot"></span>Live status</span>
      </header>

      <!-- Tabs -->
      <ul class="nav nav-pills mb-4 gap-2" data-aos="fade-up" data-aos-delay="50">
        <li class="nav-item"><button class="nav-link active chip" data-tab="upcoming" id="tabUpcoming" type="button"><i class="fa-solid fa-clock me-1"></i>Upcoming</button></li>
        <li class="nav-item"><button class="nav-link chip" data-tab="past" id="tabPast" type="button"><i class="fa-solid fa-clock-rotate-left me-1"></i>Past</button></li>
      </ul>

      <div class="parking-grid" id="bookingsGrid" data-aos="fade-up" data-aos-delay="80"></div>
      <div class="empty-state d-none" id="emptyState">
        <div class="ei"><i class="fa-solid fa-ticket"></i></div>
        <h5 id="emptyTitle">No upcoming bookings</h5>
        <p id="emptySub">Find a parking spot and your bookings will appear here.</p>
        <a class="btn btn-primary mt-2" href="dashboard.html"><i class="fa-solid fa-magnifying-glass-location me-2"></i>Find Parking</a>
      </div>
    </div>
  </main>

  <!-- Cancel confirmation modal -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-circle-xmark me-2 text-danger"></i>Cancel booking?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">Cancelling <strong id="cancelBookingRef">this booking</strong> will release the bay immediately. This cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-bs-dismiss="modal">Keep booking</button>
          <button class="btn btn-danger-soft" id="cancelConfirm"><i class="fa-solid fa-ban me-2"></i>Cancel booking</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="data/parking-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
